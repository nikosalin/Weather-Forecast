<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Atlas</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // Reads the same key/shape that zustand's persist middleware writes.
      (function () {
        try {
          var stored = JSON.parse(
            localStorage.getItem('weather-atlas:settings') || 'null',
          );
          var theme = (stored && stored.state && stored.state.theme) || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage unavailable: fall back to the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
